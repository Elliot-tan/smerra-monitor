name: Smerra 空房监测

on:
  schedule:
    # 每 30 分钟运行一次（:00 和 :30 整点触发，GitHub 可能延迟几分钟）
    - cron: "5,35 * * * *"
  workflow_dispatch: # 允许在 Actions 页面手动触发测试

permissions:
  contents: write # 需要把 state.json 提交回仓库，用于去重

jobs:
  check-availability:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 运行空房检查
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python3 check.py

      - name: 提交最新状态（用于去重）
        run: |
          if ! git diff --quiet state.json; then
            git config user.name "smerra-monitor-bot"
            git config user.email "smerra-monitor-bot@users.noreply.github.com"
            git add state.json
            git commit -m "更新空房状态 [skip ci]"
            git push
          fi
